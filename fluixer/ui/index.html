<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fluixer {{VERSION}}</title>
    <link rel="stylesheet" href="/css/nothing-ui.css" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/tube-renderer.js" defer></script>
    <script src="/image-input.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Fluixer {{VERSION}}</a>
    </header>
    <main>
      <aside>
        <nav class="sidebar-tabs" role="tablist" aria-label="Parameters">
          <button
            id="tab-project"
            type="button"
            role="tab"
            aria-controls="panel-project"
            aria-selected="false"
            tabindex="-1"
          >
            Project
          </button>
          <button
            id="tab-pattern"
            type="button"
            role="tab"
            aria-controls="panel-pattern"
            aria-selected="true"
            tabindex="0"
          >
            Pattern
          </button>
          <button
            id="tab-tube"
            type="button"
            role="tab"
            aria-controls="panel-tube"
            aria-selected="false"
            tabindex="-1"
          >
            Tube
          </button>
          <button
            id="tab-export"
            type="button"
            role="tab"
            aria-controls="panel-export"
            aria-selected="false"
            tabindex="-1"
          >
            CSV
          </button>
        </nav>
        <div
          id="panel-project"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-project"
          hidden
        >
          <section class="project-tools">
            <h2>Project</h2>
            <div class="pair">
              <button class="btn btn-outline" id="project-open" type="button" disabled>Open</button>
              <button class="btn btn-outline" id="project-save" type="button" disabled>Save</button>
            </div>
            <input class="" id="project-file" type="file" accept=".fluixer" hidden />
            <p id="project-status" class="note" role="status">Fluixer-project.fluixer</p>
          </section>
        </div>
        <div id="panel-pattern" class="sidebar-panel" role="tabpanel" aria-labelledby="tab-pattern">
          <section>
            <h2>Pattern</h2>
            <label for="pattern-type">Pattern</label>
            <select class="inp" id="pattern-type">
              <option value="captured-s">S</option>
              <option value="step">STEP</option>
              <option value="image">Image</option>
              <option value="brush">Brush</option>
              <option value="spatial-brush">Spatial Brush</option>
            </select>
            <div id="image-fields" hidden>
              <h2>Image Input</h2>
              <button class="btn btn-outline" id="image-open" type="button">Select Image</button>
              <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              <label for="image-mode">Processing Method</label>
              <select class="inp" id="image-mode">
                <option value="auto">Remove Background</option>
                <option value="photo">Subject Recognition</option>
                <option value="dark">Dark Subject</option>
                <option value="light">Light Subject</option>
              </select>
              <label for="image-threshold">Threshold</label>
              <input
                class="slider"
                id="image-threshold"
                type="range"
                min="1"
                max="254"
                value="48"
              />
              <label>
                <input id="image-invert" type="checkbox" />
                Invert Colors
              </label>
              <canvas id="image-preview" width="256" height="256" aria-label="Preview"></canvas>
              <button class="btn btn-outline" id="image-clear" type="button">Clear</button>
              <p id="image-status" role="status"></p>
            </div>
            <div id="spatial-fields" hidden>
              <label for="spatial-size">Size</label>
              <input
                class="slider"
                id="spatial-size"
                type="range"
                min="4"
                max="80"
                value="24"
                aria-label="Size"
              />
              <div class="pair">
                <button class="btn btn-outline" id="spatial-pen" type="button" aria-pressed="true">
                  Brush
                </button>
                <button
                  class="btn btn-outline"
                  id="spatial-eraser"
                  type="button"
                  aria-pressed="false"
                >
                  Eraser
                </button>
              </div>
              <div class="pair">
                <button class="btn btn-outline" id="spatial-undo" type="button">Undo</button>
                <button class="btn btn-outline" id="spatial-clear" type="button">Clear</button>
              </div>
            </div>
            <div id="brush-fields" hidden>
              <h2>Drawing</h2>
              <div class="pair">
                <button class="btn btn-outline" id="brush-pen" type="button" aria-pressed="true">
                  Brush
                </button>
                <button
                  class="btn btn-outline"
                  id="brush-eraser"
                  type="button"
                  aria-pressed="false"
                >
                  Eraser
                </button>
              </div>
              <label for="brush-size">Brush Size</label>
              <input class="slider" id="brush-size" type="range" min="2" max="64" value="16" />
              <canvas
                id="brush-canvas"
                width="256"
                height="256"
                aria-label="Drawing Board"
                tabindex="0"
              ></canvas>
              <div class="pair">
                <button class="btn btn-outline" id="brush-undo" type="button" disabled>Undo</button>
                <button class="btn btn-outline" id="brush-clear" type="button">Clear</button>
              </div>
              <p id="brush-status" class="note" role="status"></p>
            </div>
            <div id="step-fields" hidden>
              <h2>STEP Input</h2>
              <button class="btn btn-outline" id="step-open" type="button">Import</button>
              <input class="" id="step-file" type="file" accept=".stp,.step" hidden />
              <p id="step-status" class="note" role="status"></p>
              <canvas id="step-preview" width="280" height="220" aria-label="STEP Preview"></canvas>
              <button class="btn btn-outline" id="step-apply" type="button" disabled>
                Confirm
              </button>
            </div>
            <label for="mapping-type">Mapping Type</label>
            <select class="inp" id="mapping-type">
              <option value="projection">Projection</option>
              <option value="surface-flow" disabled>Surface Flow (NA)</option>
            </select>
          </section>
        </div>
        <div
          id="panel-tube"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-tube"
          hidden
        >
          <section>
            <label for="tube-type">Pipeline Curve</label>
            <select class="inp" id="tube-type">
              <option value="cylinder">Cylinder Helix</option>
              <option value="s-curve">S-Shape</option>
              <option value="hilbert">Hilbert</option>
              <option value="custom-step">Custom</option>
            </select>
            <div id="tube-step-fields" hidden>
              <button class="btn btn-outline" id="tube-step-open" type="button">Import</button>
              <input id="tube-step-file" type="file" accept=".stp,.step" hidden />
              <button
                class="btn btn-outline"
                id="tube-step-reverse"
                type="button"
                aria-pressed="false"
              >
                Reverse
              </button>
              <p id="tube-step-status" role="status"></p>
            </div>
            <div class="pair">
              <div id="tube-radius-field">
                <label id="tube-radius-label" for="tube-radius">Radius (mm)</label>
                <input
                  class="slider"
                  id="tube-slider-radius"
                  type="range"
                  min="1"
                  max="500"
                  value="40"
                  step=".1"
                  aria-label="Radius slider"
                />
                <input
                  class="inp"
                  id="tube-radius"
                  type="number"
                  min="1"
                  max="500"
                  step="any"
                  value="40"
                />
              </div>
              <div id="tube-height-field">
                <label for="tube-height">Height (mm)</label>
                <input
                  class="slider"
                  id="tube-slider-height"
                  type="range"
                  min="1"
                  max="1000"
                  value="75"
                  step=".1"
                  aria-label="Height slider"
                />
                <input
                  class="inp"
                  id="tube-height"
                  type="number"
                  min="1"
                  max="1000"
                  step="any"
                  value="75"
                />
              </div>
            </div>
            <div class="pair">
              <div>
                <label for="tube-inner">Inner Diameter (mm)</label>
                <input
                  class="slider"
                  id="tube-inner-slider"
                  type="range"
                  min="0.01"
                  max="3.99"
                  step=".01"
                  value="2"
                  aria-label="Inner Diameter slider"
                />
                <input
                  class="inp"
                  id="tube-inner"
                  type="number"
                  min="0.01"
                  max="3.99"
                  step="any"
                  value="2"
                />
              </div>
              <div>
                <label for="tube-diameter">Outer Diameter (mm)</label>
                <input
                  class="slider"
                  id="tube-slider-diameter"
                  type="range"
                  min="0.1"
                  max="100"
                  value="4"
                  step=".1"
                  aria-label="Outer Diameter slider"
                />
                <input
                  class="inp"
                  id="tube-diameter"
                  type="number"
                  min="0.1"
                  max="100"
                  step="any"
                  value="4"
                />
              </div>
            </div>
            <div id="tube-wind-field">
              <label id="tube-wind-label" for="tube-wind">Windings</label>
              <input
                class="slider"
                id="tube-slider-wind"
                type="range"
                min="1"
                max="64"
                value="16"
                step="1"
                aria-label="Windings slider"
              />
              <input
                class="inp"
                id="tube-wind"
                type="number"
                min="1"
                max="64"
                step="1"
                value="16"
              />
            </div>
            <p id="tube-render-error" role="status"></p>
            <button class="btn btn-outline" id="tube-reset" type="button">Reset</button>
          </section>
          <section id="geometry-compensation">
            <h2>Geometric Compensation</h2>
            <canvas
              id="curve-preview"
              width="280"
              height="280"
              aria-label="Bezier compensation curve"
            ></canvas>
            <label for="curve-amplitude">Amplitude (mm)</label>
            <input
              class="inp"
              id="curve-amplitude"
              type="number"
              min="-80"
              max="80"
              step="any"
              value="40"
            />
            <p id="curve-selection" class="note"></p>
            <button class="btn btn-outline" id="curve-reset" type="button">Reset</button>
            <p class="note" id="curve-status"></p>
          </section>
        </div>
        <div
          id="panel-export"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-export"
          hidden
        >
          <form id="export-form">
            <div class="eyebrow">02 / EXPORT</div>
            <h2>CSV Export</h2>
            <label for="pre-add">Pre-Add (mm)</label>
            <input
              class="slider"
              id="pre-add-slider"
              type="range"
              min="0"
              max="10000"
              step="0.1"
              value="730"
              aria-label="Pre-Add slider"
            />
            <input
              class="inp"
              id="pre-add"
              type="number"
              min="0"
              max="10000"
              step="0.1"
              value="730"
              required
            />
            <label for="speed">Speed</label>
            <input class="inp" id="speed" type="number" min="0" step="1" value="400" required />
            <div class="pair">
              <div>
                <label for="k-gas">k_Gas</label>
                <input class="inp" id="k-gas" type="number" min="0" step="1" value="606" required />
              </div>
              <div>
                <label for="k-liquid">k_Liquid</label>
                <input
                  class="inp"
                  id="k-liquid"
                  type="number"
                  min="0"
                  step="1"
                  value="625"
                  required
                />
              </div>
            </div>
            <label for="unit">Output Unit</label>
            <select class="inp" id="unit">
              <option value="steps">Steps</option>
              <option value="segments">Segments</option>
            </select>
            <button id="export" class="btn btn-primary primary" type="submit" disabled>
              Download CSV
              <span>↓</span>
            </button>
            <p id="export-status" class="note" role="status"></p>
          </form>
        </div>
      </aside>
      <article>
        <div class="view-header">
          <div><div class="eyebrow">SPATIAL PREVIEW</div></div>
          <div class="view-buttons">
            <div class="render-modes" role="group" aria-label="Display Modes">
              <button
                id="view-lines"
                class="btn-icon"
                type="button"
                aria-label="Wireframe"
                title="Wireframe"
                aria-pressed="true"
              >
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 18 8 5l8 14 5-13" />
                </svg>
              </button>
              <button
                id="view-render"
                class="btn-icon"
                type="button"
                aria-label="Render"
                title="Render"
                aria-pressed="false"
              >
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                  <ellipse cx="12" cy="5" rx="7" ry="3" />
                  <path d="M5 5v14a7 3 0 0 0 14 0V5M5 19a7 3 0 0 1 14 0" />
                </svg>
              </button>
            </div>
            <button class="btn btn-outline" id="reset" type="button">Reset View</button>
          </div>
        </div>
        <div class="viewport">
          <div class="view-tools" role="toolbar" aria-label="Pattern Tools">
            <button
              class="btn-icon"
              id="plane-toggle"
              type="button"
              aria-label="Show Pattern Plane"
              title="Show Pattern Plane"
              aria-pressed="false"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 8 13-4 5 12-13 4z" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="plane-reset"
              type="button"
              aria-label="Reset Projection"
              title="Reset Projection"
              aria-pressed="false"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10a8 8 0 1 1 1 8M4 4v6h6" />
              </svg>
            </button>
          </div>
          <select id="plane-tool" hidden aria-hidden="true">
            <option value="gumball">Coordinate Axis</option>
            <option value="direction">Projection Direction</option>
          </select>
          <div class="view-bottom-tools" role="toolbar" aria-label="Transformation Tools">
            <button
              class="btn-icon"
              id="tool-gumball"
              type="button"
              aria-label="Coordinate Axis"
              title="Coordinate Axis"
              aria-pressed="false"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 17V3m0 0L4 6m3-3 3 3M7 17h14m0 0-3-3m3 3-3 3M7 17l-4 4" />
                <circle cx="7" cy="17" r="2" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="tool-direction"
              type="button"
              aria-label="Projection Direction"
              title="Projection Direction"
              aria-pressed="false"
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 20 20 4m0 0h-7m7 0v7M8 13l3 3 3-3-3-3z" />
              </svg>
            </button>
          </div>
          <input id="contours" type="checkbox" hidden aria-hidden="true" />
          <canvas id="tube-webgl" aria-hidden="true"></canvas>
          <canvas
            id="preview"
            tabindex="0"
            aria-label="Pipe and Liquid-Gas Segment Preview"
          ></canvas>
          <div
            id="status"
            class="view-status loading"
            role="status"
            aria-label="Calculating"
            aria-busy="true"
          ></div>
          <div class="legend">
            <span>
              <i class="liquid"></i>
              Liquid
            </span>
            <span>
              <i class="gas"></i>
              Gas
            </span>
          </div>
        </div>
        <div class="playback">
          <div class="playback-controls">
            <button
              class="btn-icon"
              id="playback-start"
              type="button"
              aria-label="Go to Start"
              title="Go to Start"
              disabled
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5v14M18 5 8 12l10 7z" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="playback-play"
              type="button"
              aria-label="Play"
              title="Play"
              disabled
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path class="play-symbol" d="m8 5 11 7-11 7z" />
                <path class="pause-symbol" d="M8 5v14M16 5v14" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="playback-final"
              type="button"
              aria-label="Final Distribution"
              title="Final Distribution"
              disabled
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 5v14M6 5l10 7-10 7z" />
              </svg>
            </button>
            <select
              class="inp"
              id="playback-rate"
              aria-label="Preview Speed"
              title="Preview Speed"
              disabled
            >
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </div>
          <input
            class="slider"
            id="playback-progress"
            aria-label="Animation Preview Progress"
            type="range"
            min="0"
            max="1000"
            value="1000"
            disabled
          />
        </div>
        <div class="metrics">
          <div>
            <span>Total Pipe Length</span>
            <strong id="total">—</strong>
          </div>
          <div>
            <span>Liquid Total Length</span>
            <strong id="liquid-total">—</strong>
          </div>
          <div>
            <span>Liquid-Gas Segment Count</span>
            <strong id="count">—</strong>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
