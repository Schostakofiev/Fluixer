<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fluixer {{VERSION}}</title>
    <link rel="stylesheet" href="/css/nothing-ui.css" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/tube-renderer.js" defer></script>
    <script src="/image-input.js" defer></script>
    <script src="/history.js" defer></script>
    <script src="/visual-calibration.js" defer></script>
    <script src="/serial-controller.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Fluixer {{VERSION}}</a>
    </header>
    <main>
      <aside>
        <nav class="sidebar-tabs" role="tablist" aria-label="Parameters">
          <button
            id="tab-project"
            type="button"
            role="tab"
            aria-controls="panel-project"
            aria-selected="false"
            tabindex="-1"
          >
            Project
          </button>
          <button
            id="tab-pattern"
            type="button"
            role="tab"
            aria-controls="panel-pattern"
            aria-selected="true"
            tabindex="0"
          >
            Pattern
          </button>
          <button
            id="tab-tube"
            type="button"
            role="tab"
            aria-controls="panel-tube"
            aria-selected="false"
            tabindex="-1"
          >
            Tube
          </button>
          <button
            id="tab-output"
            type="button"
            role="tab"
            aria-controls="panel-output"
            aria-selected="false"
            tabindex="-1"
          >
            Output
          </button>
         <button
            id="tab-calibration"
            type="button"
            role="tab"
            aria-controls="panel-calibration"
            aria-selected="false"
            tabindex="-1"
          >
            Calib
          </button>
        </nav>
        <div
          id="panel-project"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-project"
          hidden
        >
          <fieldset class="csv-edit-controls">
          <section class="project-tools">
            <h2>Project</h2>
            <div class="pair">
              <button class="btn btn-outline" id="project-open" type="button" disabled>Open</button>
              <button class="btn btn-outline" id="project-save" type="button" disabled>Save</button>
            </div>
            <input class="" id="project-file" type="file" accept=".fluixer" hidden />
            <p id="project-status" class="note" role="status">Fluixer-project.fluixer</p>
          </section>
        </fieldset>
        </div>
        <div id="panel-pattern" class="sidebar-panel" role="tabpanel" aria-labelledby="tab-pattern">
          <fieldset class="csv-edit-controls">
          <section>
            <h2>Pattern</h2>
            <label for="pattern-type">Pattern Type</label>
            <select class="inp" id="pattern-type">
              <option value="captured-s">S</option>
              <option value="step">STEP</option>
              <option value="image">Image</option>
              <option value="brush">Brush</option>
              <option value="spatial-brush">Spatial Brush</option>
            </select>
            <div id="image-fields" hidden>
              <h2>Image Input</h2>
              <button class="btn btn-outline" id="image-open" type="button">Import</button>
              <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
              <label for="image-mode">Processing Method</label>
              <select class="inp" id="image-mode">
                <option value="auto">Remove Background</option>
                <option value="photo">Subject Recognition</option>
                <option value="dark">Dark Subject</option>
                <option value="light">Light Subject</option>
              </select>
              <label for="image-threshold">Threshold</label>
              <input
                class="slider"
                id="image-threshold"
                type="range"
                min="1"
                max="254"
                value="48"
              />
              <label>
                <input id="image-invert" type="checkbox" />
                Invert Colors
              </label>
              <canvas id="image-preview" width="256" height="256" aria-label="Preview"></canvas>
              <button class="btn btn-outline" id="image-clear" type="button">Clear</button>
              <p id="image-status" role="status"></p>
            </div>
            <div id="spatial-fields" hidden>
              <label for="spatial-size">Size</label>
              <input
                class="slider"
                id="spatial-size"
                type="range"
                min="4"
                max="80"
                value="24"
                aria-label="Size"
              />
              <div class="pair">
                <button class="btn btn-outline" id="spatial-pen" type="button" aria-pressed="true">
                  Brush
                </button>
                <button
                  class="btn btn-outline"
                  id="spatial-eraser"
                  type="button"
                  aria-pressed="false"
                >
                  Eraser
                </button>
              </div>
              <div class="pair">
                <button class="btn btn-outline" id="spatial-undo" type="button">Undo</button>
                <button class="btn btn-outline" id="spatial-clear" type="button">Clear</button>
              </div>
            </div>
            <div id="brush-fields" hidden>
              <h2>Drawing</h2>
              <div class="pair">
                <button class="btn btn-outline" id="brush-pen" type="button" aria-pressed="true">
                  Brush
                </button>
                <button
                  class="btn btn-outline"
                  id="brush-eraser"
                  type="button"
                  aria-pressed="false"
                >
                  Eraser
                </button>
              </div>
              <label for="brush-size">Brush Size</label>
              <input class="slider" id="brush-size" type="range" min="2" max="64" value="16" />
              <canvas
                id="brush-canvas"
                width="256"
                height="256"
                aria-label="Drawing Board"
                tabindex="0"
              ></canvas>
              <div class="pair">
                <button class="btn btn-outline" id="brush-undo" type="button" disabled>Undo</button>
                <button class="btn btn-outline" id="brush-clear" type="button">Clear</button>
              </div>
              <p id="brush-status" class="note" role="status"></p>
            </div>
            <div id="step-fields" hidden>
              <h2>STEP Input</h2>
              <button class="btn btn-outline" id="step-open" type="button">Import</button>
              <input class="" id="step-file" type="file" accept=".stp,.step" hidden />
              <p id="step-status" class="note" role="status"></p>
              <canvas id="step-preview" width="280" height="220" aria-label="STEP Preview"></canvas>
              <button class="btn btn-outline" id="step-apply" type="button" disabled>
                Confirm
              </button>
            </div>
            <label for="mapping-type">Mapping Type</label>
            <select class="inp" id="mapping-type">
              <option value="projection">Projection</option>
              <option value="surface-flow" disabled>Surface Flow (NA)</option>
            </select>
          </section>
        </fieldset>
        </div>
        <div
          id="panel-tube"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-tube"
          hidden
        >
          <fieldset class="csv-tube-controls">
          <section>
            <div class="sidebar-section-heading">
              <h2>Tube</h2>
              <button
                class="btn-icon reset-button--compact reset-button"
                id="tube-reset"
                type="button"
                aria-label="Reset Tube"
                title="Reset Tube"
              >
                <img class="ico button-svg" src="/svg/reset.svg" alt="" aria-hidden="true" draggable="false" />
              </button>
            </div>
            <label for="tube-type">Pipeline Curve</label>
            <select class="inp" id="tube-type">
              <option value="cylinder">Cylinder Helix</option>
              <option value="s-curve">S-Shape</option>
              <option value="hilbert">Hilbert</option>
              <option value="custom-step">Custom</option>
            </select>
            <div id="tube-step-fields" hidden>
              <button class="btn btn-outline" id="tube-step-open" type="button">Import</button>
              <input id="tube-step-file" type="file" accept=".stp,.step" hidden />
              <button
                class="btn btn-outline"
                id="tube-step-reverse"
                type="button"
                aria-pressed="false"
              >
                Reverse
              </button>
            </div>
            <div class="pair">
              <div id="tube-radius-field">
                <label id="tube-radius-label" for="tube-radius">Radius (mm)</label>
                <div class="slider-number-row">
                  <input
                    class="slider"
                    id="tube-slider-radius"
                    type="range"
                    min="1"
                    max="500"
                    value="40"
                    step=".1"
                    aria-label="Radius slider"
                  />
                  <input
                    class="inp"
                    id="tube-radius"
                    type="number"
                    min="1"
                    max="500"
                    step="any"
                    value="40"
                  />
                </div>
              </div>
              <div id="tube-height-field">
                <label for="tube-height">Height (mm)</label>
                <div class="slider-number-row">
                  <input
                    class="slider"
                    id="tube-slider-height"
                    type="range"
                    min="1"
                    max="1000"
                    value="75"
                    step=".1"
                    aria-label="Height slider"
                  />
                  <input
                    class="inp"
                    id="tube-height"
                    type="number"
                    min="1"
                    max="1000"
                    step="any"
                    value="75"
                  />
                </div>
              </div>
            </div>
            <fieldset class="csv-edit-controls">
            <div class="pair">
              <div>
                <label for="tube-inner">Inner Diameter (mm)</label>
                <div class="slider-number-row">
                  <input
                    class="slider"
                    id="tube-inner-slider"
                    type="range"
                    min="0.01"
                    max="3.99"
                    step=".01"
                    value="2"
                    aria-label="Inner Diameter slider"
                  />
                  <input
                    class="inp"
                    id="tube-inner"
                    type="number"
                    min="0.01"
                    max="3.99"
                    step="any"
                    value="2"
                  />
                </div>
              </div>
              <div>
                <label for="tube-diameter">Outer Diameter (mm)</label>
                <div class="slider-number-row">
                  <input
                    class="slider"
                    id="tube-slider-diameter"
                    type="range"
                    min="0.1"
                    max="100"
                    value="4"
                    step=".1"
                    aria-label="Outer Diameter slider"
                  />
                  <input
                    class="inp"
                    id="tube-diameter"
                    type="number"
                    min="0.1"
                    max="100"
                    step="any"
                    value="4"
                  />
                </div>
              </div>
            </div>
            </fieldset>
            <div id="tube-wind-field">
              <label id="tube-wind-label" for="tube-wind">Windings</label>
              <div class="slider-number-row">
                <input
                  class="slider"
                  id="tube-slider-wind"
                  type="range"
                  min="1"
                  max="64"
                  value="16"
                  step="1"
                  aria-label="Windings slider"
                />
                <input
                  class="inp"
                  id="tube-wind"
                  type="number"
                  min="1"
                  max="64"
                  step="1"
                  value="16"
                />
              </div>
            </div>
            <p id="tube-render-error" role="status"></p>
          </section>
        </fieldset>
        </div>
        <div
          id="panel-calibration"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-calibration"
          hidden
        >
          <section id="geometry-compensation">
            <fieldset class="csv-edit-controls">
            <div class="sidebar-section-heading">
              <h2>Geometric Compensation</h2>
              <button
                class="btn-icon reset-button--compact reset-button"
                id="curve-reset"
                type="button"
                aria-label="Reset Geometric Compensation"
                title="Reset Geometric Compensation"
              >
                <img class="ico button-svg" src="/svg/reset.svg" alt="" aria-hidden="true" draggable="false" />
              </button>
            </div>
            <canvas
              id="curve-preview"
              width="280"
              height="280"
              aria-label="Bezier compensation curve"
            ></canvas>

            <label for="curve-amplitude">Amplitude (mm)</label>
            <input
              class="inp"
              id="curve-amplitude"
              type="number"
              min="-80"
              max="80"
              step="any"
              value="40"
            />
            <p class="note" id="curve-status"></p>
            <section class="visual-calibration-launch">
              <h2>Visual Calibration</h2>
              <button class="btn btn-outline" id="calibration-open" type="button">Open Photo Calibration</button>
              <div class="standard-leveling-actions">
                <button class="btn btn-outline" id="calibration-standard" type="button">Export 100-Step Pattern</button>
              </div>
              <p id="calibration-standard-status" role="status"></p>
            </section>
            </fieldset>
          </section>
        </div>
        <div
          id="panel-output"
          class="sidebar-panel"
          role="tabpanel"
          aria-labelledby="tab-output"
          hidden
        >
          <form id="export-form">
          <fieldset class="csv-edit-controls">
            <h2>CSV Settings</h2>
            <label for="pre-add">Pre-Add (mm)</label>
            <input class="inp" id="pre-add" type="number" min="0" max="10000" step="0.1" value="730" required />
            <label for="length-per-100-steps">100 Steps Length (mm)</label>
            <input class="inp" id="length-per-100-steps" type="number" min="0" step="any" value="9.65" required />
            <label for="speed">Speed</label>
            <input class="inp" id="speed" type="number" min="0" step="1" value="400" required />
            <label for="unit">Output Unit</label>
            <select class="inp" id="unit"><option value="steps">Steps</option><option value="segments">Segments</option></select>
            <div class="pair">
              <div>
                <label for="k-gas">k_Gas</label>
                <input class="inp" id="k-gas" type="number" min="0" step="1" value="606" required />
              </div>
              <div>
                <label for="k-liquid">k_Liquid</label>
                <input class="inp" id="k-liquid" type="number" min="0" step="1" value="625" required />
              </div>
            </div>
            <button id="export" class="btn btn-primary primary" type="submit" disabled>
              Export Compensated CSV
              <span>↓</span>
            </button>
            <button id="export-original" class="btn btn-outline export-original" type="submit" disabled>
              Export Original CSV
              <span>↓</span>
            </button>
            <p id="export-status" class="note" role="status"></p>
          </fieldset>
        </form>
          <section class="csv-import-tools" id="serial-controls">
            <h2>Serial Output</h2>
            <div class="csv-import-actions">
              <button class="btn btn-outline" id="serial-connect" type="button">Connect</button>
              <button class="btn btn-outline" id="csv-import" type="button" aria-pressed="false" disabled>Import CSV</button>
              <button class="btn btn-outline" id="csv-preview-clear" type="button" hidden>Exit CSV Preview</button>
            </div>
            <input id="csv-file" type="file" accept=".csv,text/csv" hidden />
            <p class="note" id="csv-import-status" role="status" hidden></p>
            <div class="serial-output-actions" id="serial-generated">
              <button class="btn btn-primary" id="serial-compensated" type="button" disabled>Run Compensated<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button>
              <button class="btn btn-outline" id="serial-original" type="button" disabled>Run Original<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button>
            </div>
            <div class="playback-controls serial-playback">
              <button class="btn-icon" id="serial-start" type="button" title="Run CSV" aria-label="Run CSV" hidden disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button>
              <button class="btn-icon" id="serial-pause" type="button" title="Pause after current command" aria-label="Pause after current command" disabled>
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path id="serial-pause-symbol" d="M8 5v14M16 5v14"/></svg>
              </button>
              <button class="btn-icon" id="serial-stop" type="button" title="Stop after current command" aria-label="Stop" disabled>
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
              </button>
            </div>
            <progress id="serial-progress" value="0" max="1" aria-label="Serial execution progress"></progress>
            <p id="serial-status" role="alert" hidden></p>
          </section>

        </div>
      </aside>
      <article>
        <div class="viewport">
        <div class="view-header">
          <div class="view-buttons">
            <button id="view-compensated" class="btn-icon" type="button" aria-label="Compensated Preview" title="Compensated Preview" aria-pressed="false">
              <img class="ico button-svg" src="/svg/view-compensated.svg" alt="" aria-hidden="true" draggable="false" />
            </button>
            <span class="view-mode-divider" aria-hidden="true"></span>
            <div class="render-modes" role="group" aria-label="Display Modes">
              <button
                id="view-lines"
                class="btn-icon"
                type="button"
                aria-label="Wireframe"
                title="Wireframe"
                aria-pressed="true"
              >
                <img class="ico button-svg" src="/svg/view-lines.svg" alt="" aria-hidden="true" draggable="false" />
              </button>
              <button
                id="view-render"
                class="btn-icon"
                type="button"
                aria-label="Render"
                title="Render"
                aria-pressed="false"
              >
                <img class="ico button-svg" src="/svg/view-render.svg" alt="" aria-hidden="true" draggable="false" />
              </button>
            </div>
            <button class="btn btn-outline reset-button" id="reset" type="button"><img class="ico button-svg" src="/svg/reset.svg" alt="" aria-hidden="true" draggable="false" />Reset View</button>
          </div>
        </div>
          <div class="view-tools" role="toolbar" aria-label="Pattern Tools">
            <button
              class="btn-icon"
              id="plane-toggle"
              type="button"
              aria-label="Show Pattern Plane"
              title="Show Pattern Plane"
              aria-pressed="false"
            >
              <img class="ico button-svg" src="/svg/plane-toggle.svg" alt="" aria-hidden="true" draggable="false" />
            </button>
            <button
              class="btn-icon"
              id="tool-gumball"
              type="button"
              aria-label="Coordinate Axis"
              title="Coordinate Axis"
              aria-pressed="false"
            >
              <img class="ico button-svg" src="/svg/tool-gumball.svg" alt="" aria-hidden="true" draggable="false" />
            </button>
            <button
              class="btn-icon"
              id="tool-direction"
              type="button"
              aria-label="Projection Depth"
              title="Projection Depth"
              aria-pressed="false"
            >
              <img class="ico button-svg" src="/svg/tool-direction.svg" alt="" aria-hidden="true" draggable="false" />
            </button>
            <button
              class="btn-icon reset-button"
              id="plane-reset"
              type="button"
              aria-label="Reset Projection"
              title="Reset Projection"
              aria-pressed="false"
            >
              <img class="ico button-svg" src="/svg/reset.svg" alt="" aria-hidden="true" draggable="false" />
            </button>
          </div>
          <select id="plane-tool" hidden aria-hidden="true">
            <option value="gumball">Coordinate Axis</option>
            <option value="direction">Projection Direction</option>
          </select>
          <canvas id="tube-webgl" aria-hidden="true"></canvas>
          <canvas
            id="preview"
            tabindex="0"
            aria-label="Pipe and Liquid-Gas Segment Preview"
          ></canvas>
          <div
            id="status"
            class="view-status loading"
            role="status"
            aria-label="Calculating"
            aria-busy="true"
          ></div>
          <div class="legend">
            <span>
              <i class="liquid"></i>
              Liquid
            </span>
            <span>
              <i class="gas"></i>
              Gas
            </span>
          </div>
        </div>
        <div class="playback">
          <div class="playback-controls">
            <button
              class="btn-icon"
              id="playback-start"
              type="button"
              aria-label="Go to Start"
              title="Go to Start"
              disabled
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5v14M18 5 8 12l10 7z" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="playback-play"
              type="button"
              aria-label="Play"
              title="Play"
              disabled
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path class="play-symbol" d="m8 5 11 7-11 7z" />
                <path class="pause-symbol" d="M8 5v14M16 5v14" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="playback-final"
              type="button"
              aria-label="Final Distribution"
              title="Final Distribution"
              disabled
            >
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 5v14M6 5l10 7-10 7z" />
              </svg>
            </button>
            <select
              class="inp"
              id="playback-rate"
              aria-label="Preview Speed"
              title="Preview Speed"
              disabled
            >
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
          </div>
          <input
            class="slider"
            id="playback-progress"
            aria-label="Animation Preview Progress"
            type="range"
            min="0"
            max="1000"
            value="1000"
            disabled
          />
        </div>
        <div class="metrics">
          <div>
            <span>Total Pipe Length</span>
            <strong id="total">—</strong>
          </div>
          <div>
            <span>Current Output</span>
            <strong id="current-output">
              <span id="current-output-value">—</span>
              <span id="current-output-unit">steps</span>
            </strong>
          </div>
          <div>
            <span>Liquid-Gas Segment Count</span>
            <strong id="count">—</strong>
          </div>
        </div>
      </article>
    </main>
    <dialog id="calibration-dialog" aria-labelledby="calibration-title">
      <div class="calibration-dialog-heading">
        <h2 id="calibration-title">Visual Calibration</h2>
        <button class="btn-icon" id="calibration-close" type="button" aria-label="Close" title="Close">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <fieldset class="csv-edit-controls calibration-dialog-content">
        <div class="calibration-photo-area">
          <canvas id="calibration-photo" width="600" height="600" aria-label="Photo endpoints. In manual mode click to add a point; Alt-click to remove a point." hidden></canvas>
        </div>
        <div class="calibration-photo-controls">
          <button class="btn btn-outline" id="calibration-file-open" type="button">Import Photo</button>
          <input id="calibration-file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden />
          <button class="btn btn-outline" id="calibration-pick-color" type="button" aria-pressed="false" disabled>Pick Color</button>
          <label for="calibration-mode">Endpoints</label>
          <select class="inp" id="calibration-mode">
            <option value="auto">Automatic</option>
            <option value="manual">Mark Points</option>
          </select>
          <div class="sidebar-section-heading calibration-parameters-heading">
            <h2>Parameters</h2>
            <button class="btn-icon reset-button--compact reset-button" id="calibration-parameters-reset" type="button" aria-label="Reset Parameters" title="Reset Parameters">
              <img class="ico button-svg" src="/svg/reset.svg" alt="" aria-hidden="true" draggable="false" />
            </button>
          </div>
          <div class="calibration-thresholds">
            <div>
              <label for="calibration-sensitivity">Sensitivity</label>
              <div class="slider-number-row">
                <input class="slider" id="calibration-sensitivity-slider" type="range" min="0" max="100" value="50" step="1" aria-label="Sensitivity" />
                <input class="inp" id="calibration-sensitivity" type="number" min="0" max="100" value="50" step="1" />
              </div>
            </div>
            <div>
              <label for="calibration-noise">Noise Filter</label>
              <div class="slider-number-row">
                <input class="slider" id="calibration-noise-slider" type="range" min="0" max="100" value="50" step="1" aria-label="Noise Filter" />
                <input class="inp" id="calibration-noise" type="number" min="0" max="100" value="50" step="1" />
              </div>
            </div>
          </div>
          <div class="calibration-actions">
            <button class="btn btn-outline" id="calibration-points-clear" type="button">Clear Points</button>
            <button class="btn btn-outline" id="calibration-download" type="button" disabled>Export Measurements</button>
          </div>
          <output id="calibration-result" aria-live="polite"></output>
          <p id="calibration-error" role="alert"></p>
          <button class="btn btn-primary" id="calibration-apply" type="button" disabled>Apply Compensation</button>
        </div>
      </fieldset>
    </dialog>
  </body>
</html>
